name: "sshbrowse"
arch: ${GOARCH}
platform: "linux"
version: "${SSHBROWSER_VERSION}"
section: "net"
priority: "optional"
maintainer: "osmocomet"
description: "SSH session manager"
vendor: "osmocomet"
homepage: "https://github.com/osmocomet/sshbrowse"
license: "Proprietary"
release: "1"

contents:
  - src: "./bin/sshbrowse"
    dst: "/usr/bin/sshbrowse"
  - src: "./NOTICE"
    dst: "/usr/share/doc/sshbrowse/NOTICE"
  - src: "./docs/legal/THIRD_PARTY_NOTICES.txt"
    dst: "/usr/share/doc/sshbrowse/THIRD_PARTY_NOTICES.txt"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/sshbrowse.png"
  - src: "./build/linux/sshbrowse.desktop"
    dst: "/usr/share/applications/io.github.osmocomet.sshbrowse.desktop"

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - openssh-client

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
      - openssh-clients
